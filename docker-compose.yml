services:
  db:
    image: mysql:latest
    container_name: drone_db
    env_file: ".env"
    ports:
      - "3306:3306"
    volumes:
      - ./data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d/
    

  leaderboard:
    image: leaderboard:latest
    container_name: leaderboard
    env_file: .env
    build:
      context: .
      dockerfile: leaderboard.dockerfile
    ports:
      - "8080:80"
    depends_on:
      - db